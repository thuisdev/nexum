services:
  db:
    image: postgres:16-alpine

    container_name: nexum-db

    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      # 5433 avoids conflict with a local PostgreSQL install on 5432
      - "5433:5432"
    volumes:
      - nexum-db-data:/var/lib/postgresql/data

volumes:
  nexum-db-data: